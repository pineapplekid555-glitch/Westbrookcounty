<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Countdown | Westbrook County</title>

    <link
        rel="icon"
        type="image/png"
        href="/assets/images/westbrook-logo.png"
    >

    <link
        rel="stylesheet"
        href="/assets/css/styles.css"
    >

</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <a href="/" class="brand">

            <img
                src="/assets/images/westbrook-logo.png"
                alt="Westbrook County"
            >

            <span data-site-name>
                Westbrook County
            </span>

        </a>

        <button
            class="menu-button"
            data-menu-button
            type="button"
        >
            MENU
        </button>

        <nav
            class="navigation"
            data-navigation
        >

            <a href="/">
                Home
            </a>

            <a href="/pages/updates.html">
                Updates
            </a>

            <a href="/pages/liveries.html">
                Custom Liveries
            </a>

        </nav>

    </div>

</header>


<main>

<section
    class="countdown-page"
    data-countdown-page
>

    <div class="container countdown-page-content">

        <div class="countdown-page-eyebrow">
            Westbrook County
        </div>

        <h1>
            Release Countdown
        </h1>

        <p class="countdown-page-description">
            The county is getting ready.
        </p>


        <div class="release-panel">

            <div
                class="release-status"
                data-release-status
            >
                COMING SOON
            </div>


            <div class="release-countdown">

                <div class="release-unit">
                    <strong data-days>00</strong>
                    <small>DAYS</small>
                </div>

                <div class="release-unit">
                    <strong data-hours>00</strong>
                    <small>HOURS</small>
                </div>

                <div class="release-unit">
                    <strong data-minutes>00</strong>
                    <small>MINUTES</small>
                </div>

                <div class="release-unit">
                    <strong data-seconds>00</strong>
                    <small>SECONDS</small>
                </div>

            </div>

        </div>


        <div class="countdown-actions">

            <a
                href="#"
                class="button button-primary"
                data-roblox
            >
                Play on Roblox
            </a>

            <a
                href="#"
                class="button button-secondary"
                data-discord
            >
                Join Discord
            </a>

            <a
                href="/pages/updates.html"
                class="button button-secondary"
            >
                View Updates
            </a>

        </div>

    </div>

</section>

</main>


<footer class="site-footer">

    <div class="container footer-inner">

        <span>
            © 2026 Westbrook County
        </span>

        <a href="/">
            Home
        </a>

    </div>

</footer>


<script src="/assets/js/content.js"></script>
<script src="/assets/js/app.js"></script>

</body>
</html>
