<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Site | Westbrook County</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><img class="brand-mark" src="assets/images/westbrook-logo.png" alt="Westbrook County"><span>Westbrook County</span></a><nav class="site-nav" style="display:flex"><a href="index.html">Back to site</a></nav></div></header><main class="section"><div class="page-title"><div class="eyebrow">SITE EDITOR</div><h1>Edit Westbrook</h1><p>Change the content here, save it in this browser for preview, or download a new <strong>content.js</strong> file for your GitHub site.</p></div><div id="editor" class="admin-grid"></div><div class="admin-actions"><button id="save" class="button">Save & preview</button><button id="download" class="button secondary">Download content.js</button><button id="reset" class="button danger">Reset</button></div><div id="notice" class="notice">Edits saved here are local to this browser until you download the file and replace <code>assets/js/content.js</code> in GitHub.</div></main><script src="assets/js/content.js"></script><script>
(function(){const original=JSON.parse(JSON.stringify(window.WESTBROOK));let C=JSON.parse(JSON.stringify(original));const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/\\/g,'\\\\').replace(/`/g,'\\`');
function input(label,key,value,multi=false){return `<div class="field"><label>${label}</label>${multi?`<textarea data-key="${key}">${String(value??'')}</textarea>`:`<input data-key="${key}" value="${String(value??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">`}</div>`}
function render(){const e=$('#editor');e.innerHTML=`<div class="admin-card"><h2>Homepage</h2>${input('Eyebrow','eyebrow',C.home.eyebrow)}${input('Title','title',C.home.title)}${input('Text','text',C.home.text)}${input('Button text','buttonText',C.home.buttonText)}</div><div class="admin-card"><h2>Release</h2>${input('Release timestamp','releaseAt',C.releaseAt)}${input('Hours before countdown disappears','hideCountdownAfterHours',C.hideCountdownAfterHours)}</div><div class="admin-card"><h2>Custom Liveries</h2>${input('Google Drive folder','liveries',C.links.liveries)}</div><div class="admin-card"><h2>Highlights</h2>${C.highlights.map((x,i)=>`<div class="admin-update"><h3>Highlight ${i+1}</h3>${input('Title',`h${i}t`,x.title)}${input('Text',`h${i}x`,x.text)}</div>`).join('')}</div><div class="admin-card"><h2>Updates</h2><p>Each update is displayed as a title with bullet points underneath.</p><div id="updates-editor">${C.updates.map((x,i)=>`<div class="admin-update"><div class="admin-update-head"><h3>Update ${i+1}</h3><button type="button" class="danger remove" data-i="${i}">Remove</button></div>${input('Date',`u${i}d`,x.date)}${input('Title',`u${i}t`,x.title)}${input('Tag',`u${i}g`,x.tag)}${input('Image path (optional)',`u${i}im`,x.image)}${input('Bullet points — one per line',`u${i}it`,(x.items||[]).join('\n'),true)}</div>`).join('')}</div><button id="addUpdate" type="button" class="button secondary">+ Add update</button></div>`;e.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{C.updates.splice(Number(b.dataset.i),1);render()});$('#addUpdate').onclick=()=>{C.updates.unshift({date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}),title:'New update',tag:'',image:'',items:['New feature']});render()}}
function read(){const get=k=>{const x=document.querySelector(`[data-key="${k}"]`);return x?x.value:''};C.home.eyebrow=get('eyebrow');C.home.title=get('title');C.home.text=get('text');C.home.buttonText=get('buttonText');C.releaseAt=get('releaseAt');C.hideCountdownAfterHours=Number(get('hideCountdownAfterHours'))||24;C.links.liveries=get('liveries');C.highlights.forEach((x,i)=>{x.title=get(`h${i}t`);x.text=get(`h${i}x`)});C.updates=C.updates.map((x,i)=>({...x,date:get(`u${i}d`),title:get(`u${i}t`),tag:get(`u${i}g`),image:get(`u${i}im`),items:get(`u${i}it`).split('\n').map(s=>s.trim()).filter(Boolean)}))}
function download(){const js='window.WESTBROOK = '+JSON.stringify(C,null,2)+';\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));a.download='content.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#save').onclick=()=>{read();localStorage.setItem('westbrook-content',JSON.stringify(C));$('#notice').className='notice success';$('#notice').textContent='Saved in this browser. Download content.js and replace assets/js/content.js in GitHub to publish it.'};$('#download').onclick=()=>{read();download()};$('#reset').onclick=()=>{localStorage.removeItem('westbrook-content');C=JSON.parse(JSON.stringify(original));render()};const saved=localStorage.getItem('westbrook-content');if(saved)try{C=JSON.parse(saved)}catch(e){}render()})();
</script></body></html>
